name: Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s '0.10.20+65efd5b93'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check MoonBit
        run: |
          moon version --all
          moon fmt --check
          moon check --target js --deny-warn
          moon check --target wasm-gc --deny-warn
          moon test --target js
          moon test --target wasm-gc
      - name: Run minimal example
        run: |
          EXPECTED=$'kept 2 segments, output_duration_us=4000000\nsource 4000000us -> output 2000000us'
          OUT_JS=$(moon run examples/minimal --target js)
          echo "$OUT_JS"
          diff -u <(echo "$EXPECTED") <(echo "$OUT_JS")
          OUT_WASM=$(moon run examples/minimal --target wasm-gc)
          echo "$OUT_WASM"
          diff -u <(echo "$EXPECTED") <(echo "$OUT_WASM")
      - name: Build and run media tests
        run: npm test
      - name: Install Chrome and Playwright for browser smoke
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          npm install --no-save --prefix "$RUNNER_TEMP/browser-smoke" playwright-core@1.62.1
          test -x /usr/bin/google-chrome
          test -f "$RUNNER_TEMP/browser-smoke/node_modules/playwright-core/index.mjs"
      - name: Browser smoke without a model
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-smoke/node_modules/playwright-core/index.mjs
          CHROME_BIN: /usr/bin/google-chrome
          BROWSER_SCREENSHOT: browser-smoke.png
        run: node tests/browser.mjs
      - name: Upload browser smoke screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: browser-smoke.png
          if-no-files-found: ignore
