name: Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s '0.10.20+65efd5b93'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check MoonBit
        run: |
          moon version --all
          moon fmt --check
          moon check --target js --deny-warn
          moon check --target wasm-gc --deny-warn
          moon test --target js
          moon test --target wasm-gc
      - name: Run minimal example
        run: |
          EXPECTED=$'kept 2 segments, output_duration_us=4000000\nsource 4000000us -> output 2000000us'
          OUT_JS=$(moon run examples/minimal --target js)
          echo "$OUT_JS"
          diff -u <(echo "$EXPECTED") <(echo "$OUT_JS")
          OUT_WASM=$(moon run examples/minimal --target wasm-gc)
          echo "$OUT_WASM"
          diff -u <(echo "$EXPECTED") <(echo "$OUT_WASM")
      - name: Build and run media tests
        run: npm test
